name: publicar

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Bajar catalogo y precios
        run: |
          # La cache (data/cache) esta versionada en el repo. En un checkout nuevo todos
          # los ficheros tienen mtime de ahora y el TTL de fetch.mjs los da por frescos,
          # asi que el CI compilaba con la cache commiteada (precios del 02/06-11).
          # Corregido 07-11: se limpia antes de bajar y se fuerza ttl 0.
          rm -rf data/cache
          node scripts/fetch.mjs --ttl=0

      - name: Rellenar sets sin traduccion (vintage)
        run: |
          node scripts/fill-en.mjs
          node scripts/assemble.mjs

      - name: Panel de visitas
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
        run: node scripts/panel.mjs

      - name: Construir la web
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: node scripts/build.mjs

      - name: Web de Yu-Gi-Oh
        run: |
          node ygo/scripts/fetch.mjs
          node ygo/scripts/build.mjs

      - name: Web de Magic
        run: |
          node magic/scripts/fetch.mjs
          node magic/scripts/build.mjs

      - name: Foto del dia e informe
        run: |
          node scripts/snapshot.mjs
          node scripts/informe.mjs

      - name: Aviso a Telegram
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/telegram.mjs

      - name: Guardar historico de precios
        run: |
          git config user.name "valorcarta-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/history || true
          if [ -f data/changes.json ]; then git add data/changes.json; fi
          if [ -f data/sets.json ]; then git add data/sets.json; fi
          if git diff --cached --quiet; then echo "sin cambios"; else git commit -m "precios $(date -u +%F)"; fi
          git push || echo "nada que subir"

      # Pages sirve desde la rama gh-pages: publicamos empujando dist allí.
      - name: Publicar en gh-pages
        run: |
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -q -b gh-pages
          git add -A
          git -c user.email=bot@valorcarta.es -c user.name=valorcarta commit -qm "dist $(date -u +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue hecho en el job anterior
        run: echo "gh-pages actualizado"

      - uses: actions/checkout@v4

      - name: Avisar a los buscadores (IndexNow)
        continue-on-error: true
        run: |
          git clone --depth 1 "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" repo
          cd repo
          node scripts/indexnow.mjs
