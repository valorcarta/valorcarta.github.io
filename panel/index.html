<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Panel · ValorCarta</title>
<style>
body{margin:0;font:16px/1.5 "Inter",-apple-system,sans-serif;background:#f6f4ef;color:#14120f}
#puerta{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f6f4ef;z-index:99}
#puerta .c{background:#fffdf9;border:1px solid #e7e1d6;border-radius:16px;padding:26px 28px;box-shadow:0 20px 50px rgba(20,18,15,.10);max-width:360px}
#puerta h1{font-size:1.2rem;margin:0 0 6px}
#puerta p{color:#6d675e;font-size:.86rem;margin:0 0 14px}
#puerta input{width:100%;padding:12px;border:1px solid #ddd7c9;border-radius:10px;font:15px inherit;margin-bottom:10px}
#puerta button{width:100%;padding:12px;border:0;border-radius:10px;background:#14120f;color:#fff;font:700 15px/1 inherit;cursor:pointer}
#puerta .e{color:#b3402f;font-size:.8rem;margin-top:8px;display:none}
</style></head><body>
<div id="puerta"><div class="c"><h1>Panel interno</h1><p>Esto es el registro en crudo. Clave:</p>
<input id="k" type="password" placeholder="Clave" onkeydown="if(event.key==='Enter')abrir()">
<button onclick="abrir()">Entrar</button><div class="e" id="e">No es esa.</div></div></div>
<iframe id="cuerpo" style="display:none;border:0;width:100%;height:100vh" src="registro/panel.html"></iframe>
<script>
function abrir(){var k=document.getElementById('k').value.trim();
 if(k==='valorcarta2026'){document.getElementById('puerta').style.display='none';document.getElementById('cuerpo').style.display='block';}
 else{document.getElementById('e').style.display='block';}}
</script></body></html>
