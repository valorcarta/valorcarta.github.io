<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valora tu colección · ValorCarta</title>
<meta name="description" content="Pega tu lista y ve cuánto vale tu colección de cartas Pokémon hoy. Hasta 20 cartas gratis, sin registro, con la fecha del dato al lado.">
<style>
body{margin:0;background:#f6f4ef;color:#14120f;font:16px/1.5 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.w{max-width:820px;margin:0 auto;padding:34px 20px 70px}
.s{font:600 10px/1 ui-monospace,monospace;letter-spacing:.16em;text-transform:uppercase;color:#8a6400}
h1{font-family:"Inter Tight",sans-serif;font-weight:800;letter-spacing:-.03em;font-size:clamp(1.7rem,4.4vw,2.5rem);margin:10px 0 6px}
.meta{color:#6d675e;font-size:.9rem;margin:0 0 18px}
textarea{width:100%;min-height:150px;padding:14px;border:1px solid #ddd7c9;border-radius:14px;font:15px/1.6 inherit;background:#fffdf9;resize:vertical}
.caja{background:#fffdf9;border:1px solid #e7e1d6;border-radius:20px;padding:20px 22px;margin:18px 0 0;box-shadow:0 1px 2px rgba(20,18,15,.05),0 14px 34px rgba(20,18,15,.07)}
.cifra{font-family:"Inter Tight",sans-serif;font-weight:800;font-size:2.4rem;letter-spacing:-.04em;margin:4px 0 0}
.fecha{font:600 11px/1 ui-monospace,monospace;color:#8d8474;margin-left:10px}
.btn{display:inline-block;margin-top:16px;background:#14120f;color:#fff;border:0;border-radius:12px;padding:14px 20px;font:600 15px/1 inherit;cursor:pointer;text-decoration:none}
.btn.ghost{background:transparent;color:#14120f;border:1px solid #d8d1c2}
.huecos{color:#6d675e;font-size:.88rem;margin:10px 0 0}
table{width:100%;border-collapse:collapse;margin-top:14px}
td{padding:9px 0;border-bottom:1px solid #efe9dd;font-size:.94rem}tr:last-child td{border:0}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.falta{color:#b3402f}
</style></head><body><div class="w">
<p class="s">ValorCarta</p>
<h1>Pega tu lista. 20 cartas gratis.</h1>
<p class="meta">Una carta por línea, con cantidad si quieres (<b>Charizard x2</b>). El precio es el de hoy, con su fecha al lado. Sin registro.</p>
<textarea id="t" placeholder="Charizard x1&#10;Pikachu x2&#10;Mew ex"></textarea>
<p class="huecos" id="huecos">0 de 20 huecos usados</p>
<div class="caja"><span class="cifra" id="total">— €</span><span class="fecha" id="fecha">24/11, 04:00</span>
<p class="meta" id="cuenta" style="margin:6px 0 0"></p>
<div id="filas"></div>
<a class="btn" id="guardar" href="/club/" style="display:none">Guardar esta foto</a>
<p class="meta" style="margin:14px 0 0;font-size:.8rem">Cuando pasen 20 cartas, la 21 pide cuenta: ahí empieza El Círculo.</p>
</div>
<script>
(async () => {
  const idx = await (await fetch('/data/cartas.json')).json();
  const norm = (s) => String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
  const mapa = new Map();
  for (const [slug, n, set, p] of idx) { const k = norm(n); if (!mapa.has(k)) mapa.set(k, []); mapa.get(k).push({ slug, n, set, p }); }
  // 24-11: «Charizard base» tiene que encontrar Charizard. Exacto primero; si no, por inclusión.
  const buscar = (n) => {
    const exacto = mapa.get(n);
    if (exacto) return exacto;
    if (n.length < 4) return [];
    const cands = [];
    for (const [k, v] of mapa) { if (k.startsWith(n) || n.startsWith(k)) cands.push(...v); }
    return cands;
  };
  const eur = (v) => v.toLocaleString('es-ES', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' €';
  const t = document.getElementById('t');
  const render = () => {
    const lineas = t.value.split('\n').map((x) => x.trim()).filter(Boolean);
    let total = 0, usadas = 0; const filas = []; const lista = [];
    for (const linea of lineas) {
      if (usadas >= 20) break;
      const m = linea.match(/^(.*?)(?:\s*[x×*]\s*(\d+))?$/i);
      const nombre = norm(m[1] || ''); const q = parseInt(m[2] || '1', 10) || 1;
      if (!nombre) continue;
      const hits = buscar(nombre);
      if (!hits.length) { filas.push('<tr><td class="falta">' + m[1] + ' · sin referencia</td><td class="n">—</td></tr>'); continue; }
      const c = hits.sort((a, b) => (b.p || 0) - (a.p || 0))[0];
      if (!c.p) { filas.push('<tr><td class="falta">' + c.n + ' · sin precio</td><td class="n">—</td></tr>'); continue; }
      usadas++;
      total += c.p * q; lista.push({ s: c.slug, q });
      filas.push('<tr><td>' + c.n + '<br><small style="color:#8d8474">' + c.set + (q > 1 ? ' · x' + q : '') + '</small></td><td class="n">' + eur(c.p * q) + '</td></tr>');
    }
    document.getElementById('filas').innerHTML = filas.length ? '<table>' + filas.join('') + '</table>' : '';
    document.getElementById('total').textContent = usadas ? eur(total) : '— €';
    document.getElementById('huecos').textContent = usadas + ' de 20 huecos usados';
    document.getElementById('cuenta').textContent = usadas ? usadas + (usadas === 1 ? ' carta valorada' : ' cartas valoradas') : 'Pega al menos una carta para ver tu cifra.';
    const g = document.getElementById('guardar');
    if (usadas) {
      g.style.display = 'inline-block';
      const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(lista)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      g.href = '/club/#c=' + b64;
    }
  };
  t.addEventListener('input', render);
})();
</script>
</div></body></html>
